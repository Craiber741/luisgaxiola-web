name: Deploy to Banahost

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Rebuild diario para re-leer todos los canales (blog, YouTube, Substack, Instagram)
    # 09:00 UTC ≈ 02:00 en Mexicali (horario de verano)
    - cron: '0 9 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          AD_ACCOUNT_NICHES: ${{ secrets.AD_ACCOUNT_NICHES }}

      - name: Deploy via FTP to Banahost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /
